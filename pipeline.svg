<text x="53" y="183" fill="#627d90" font-size="12" font-family="Consolas,monospace">INGEST</text><text x="379" y="183" fill="#627d90" font-size="12" font-family="Consolas,monospace">MODEL</text><text x="681" y="183" fill="#627d90" font-size="12" font-family="Consolas,monospace">REASON</text><text x="983" y="183" fill="#627d90" font-size="12" font-family="Consolas,monospace">ACTIVATE</text>
