<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="438" viewBox="0 0 1200 438" role="img" aria-labelledby="title desc">
<title id="title">Fahad Farrukh — AI &amp; Data Engineer</title>
<desc id="desc">From data foundations to intelligent applications. A neural network rises above three data layers, with subtle moving signals. Lille, France. Applied AI, data engineering, and business intelligence.</desc>
<defs>
 <radialGradient id="halo"><stop offset="0" stop-color="#79cdbb" stop-opacity=".13"/><stop offset="1" stop-color="#79cdbb" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#117c6c" stop-opacity=".75"/><stop offset=".55" stop-color="#456f9b" stop-opacity=".25"/><stop offset="1" stop-color="#456f9b" stop-opacity="0"/></linearGradient>
