</defs>
<style>
 .packet{animation:layer-flow 14s linear infinite;opacity:.75}
 .layer-1{animation-delay:-4s} .layer-2{animation-delay:-8s}
 .neural-packet{animation:neural-flow 10s linear infinite;opacity:.6}
 .node-pulse{animation:breathe 7s ease-in-out infinite}
 .pulse-11{animation-delay:-2s} .pulse-26{animation-delay:-4s}
 @keyframes layer-flow{to{stroke-dashoffset:-632}}
 @keyframes neural-flow{0%{stroke-dashoffset:20;opacity:0}15%{opacity:.7}75%{opacity:.7}100%{stroke-dashoffset:-180;opacity:0}}
 @keyframes breathe{0%,100%{opacity:.05}50%{opacity:.2}}
 @media (prefers-reduced-motion:reduce){.packet,.neural-packet,.node-pulse{animation:none!important}.neural-packet{opacity:0}}
</style>
