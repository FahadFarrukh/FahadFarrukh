<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="242" viewBox="0 0 1280 242" role="img" aria-label="Animated AI engineering terminal introducing Fahad's focus areas">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#071c21"/></linearGradient><clipPath id="line1"><rect x="0" y="75" width="800" height="36" class="line1"/></clipPath><clipPath id="line2"><rect x="0" y="121" width="900" height="36" class="line2"/></clipPath><clipPath id="line3"><rect x="0" y="167" width="950" height="36" class="line3"/></clipPath></defs>
<style>@keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}.line1,.line2,.line3{transform-origin:0 0;animation:reveal 1.2s ease-out backwards}.line2{animation-delay:1.25s}.line3{animation-delay:2.6s}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1s steps(1) infinite}@media(prefers-reduced-motion:reduce){.cursor,.line1,.line2,.line3{animation:none}}</style>
<rect x="1" y="1" width="1278" height="240" rx="14" fill="url(#bg)" stroke="#166675" stroke-width="2"/>
<path d="M0 49H1280" stroke="#154450"/>
<circle cx="27" cy="25" r="6" fill="#fb7185"/><circle cx="49" cy="25" r="6" fill="#fbbf24"/><circle cx="71" cy="25" r="6" fill="#34d399"/>
<text x="641" y="31" fill="#7b9ca9" font-family="Consolas,Monaco,monospace" font-size="14" text-anchor="middle">fahad@intelligent-systems ~ / terminal</text>
<g font-family="Consolas,Monaco,monospace" font-size="22">
<g clip-path="url(#line1)"><text x="33" y="102"><tspan fill="#37f3ce">$</tspan><tspan fill="#d6eaf2"> whoami</tspan><tspan fill="#6fa9ba">  →  </tspan><tspan fill="#b7a2ff">AI Engineer + Data Engineer</tspan></text></g>
<g clip-path="url(#line2)"><text x="33" y="148"><tspan fill="#37f3ce">$</tspan><tspan fill="#d6eaf2"> research --domain</tspan><tspan fill="#6fa9ba">  →  </tspan><tspan fill="#7deaf4">NLP / Neuro-Symbolic AI</tspan></text></g>
<g clip-path="url(#line3)"><text x="33" y="194"><tspan fill="#37f3ce">$</tspan><tspan fill="#d6eaf2"> build --stack</tspan><tspan fill="#6fa9ba">  →  </tspan><tspan fill="#e7d48c">Python / SQL / Cloud / Agents</tspan></text></g>
<rect x="878" y="175" width="12" height="23" fill="#3bf1d7" class="cursor"/>
</g>
</svg>